name: CD

# Pubblica l'APK di release come GitHub Release quando viene pushato un tag
# `v*` (es. `v0.7.2`). Niente action di terze parti per il rilascio: la
# pubblicazione usa la CLI `gh` già presente sui runner, stessa filosofia
# della DCO check in ci.yml (meno supply chain, meno da revisionare).
#
# Firma: le credenziali arrivano dai secret JENNY_KEYSTORE_* e vengono passate
# come env a Gradle, che è già predisposto per questo (vedi commenti in
# android/app/build.gradle.kts). Se i secret non sono configurati la build
# NON fallisce: produce un APK unsigned con un warning, come in locale.
on:
  push:
    tags: ["v*"]

permissions:
  # Necessario a `gh release create` / `gh release upload` col token integrato.
  contents: write

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth 0: `gh release create --generate-notes` cammina il range
          # di commit dal tag precedente, che uno shallow clone non contiene.
          fetch-depth: 0

      # AGP 8.7 e Chaquopy 17 richiedono JDK 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # buildPython di Chaquopy: il major.minor dell'interprete host deve
      # coincidere con `chaquopy.defaultConfig.version` (3.11). L'ubuntu
      # runner ha python3 più recente di default, senza questo step la build
      # fallirebbe con un mismatch di versione.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # SDK commandline tools + licenze accettate; piattaforme/build-tools
      # vengono scaricati da AGP al primo build.
      - uses: android-actions/setup-android@v4

      - name: Build APKs
        env:
          # Vuoti (secret non configurati) → release unsigned, come da design.
          JENNY_KEYSTORE_PATH: ${{ secrets.JENNY_KEYSTORE_PATH }}
          JENNY_KEYSTORE_PASSWORD: ${{ secrets.JENNY_KEYSTORE_PASSWORD }}
          JENNY_KEY_ALIAS: ${{ secrets.JENNY_KEY_ALIAS }}
          JENNY_KEY_PASSWORD: ${{ secrets.JENNY_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew --no-daemon app:assembleDebug app:assembleRelease

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          # Senza i secret JENNY_KEYSTORE_* la release è unsigned e AGP la
          # chiama app-release-unsigned.apk: accetta entrambi i nomi.
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          [ -f "$RELEASE_APK" ] || RELEASE_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$RELEASE_APK"
          test -f "$DEBUG_APK"
          # Nomi versionati, più chiari di app-release.apk nella pagina release.
          cp "$RELEASE_APK" "jenny-${TAG}.apk"
          cp "$DEBUG_APK" "jenny-${TAG}-debug.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Rerun del workflow o tag già rilasciato: aggiorna gli asset.
            gh release upload "$TAG" "jenny-${TAG}.apk" "jenny-${TAG}-debug.apk" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "jenny-${TAG}.apk" "jenny-${TAG}-debug.apk" \
              --repo "$GITHUB_REPOSITORY" --title "Jenny $TAG" --generate-notes
          fi
