name: CD

# Pubblica l'APK di release come GitHub Release quando viene pushato un tag
# `v*` (es. `v0.7.2`). Niente action di terze parti per il rilascio: la
# pubblicazione usa la CLI `gh` già presente sui runner, stessa filosofia
# della DCO check in ci.yml (meno supply chain, meno da revisionare).
#
# Firma: il keystore arriva dal secret JENNY_KEYSTORE_B64 (base64 del file
# .jks, decodificato in un passo dedicato) e le credenziali dai secret
# JENNY_KEYSTORE_PASSWORD / JENNY_KEY_ALIAS / JENNY_KEY_PASSWORD, passati come
# env a Gradle, che è già predisposto per questo (vedi commenti in
# android/app/build.gradle.kts). Se i secret non sono configurati la build
# NON fallisce: produce un APK unsigned con un warning, come in locale.
on:
  push:
    tags: ["v*"]

permissions:
  # Necessario a `gh release create` / `gh release upload` col token integrato.
  contents: write

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth 0: `gh release create --generate-notes` cammina il range
          # di commit dal tag precedente, che uno shallow clone non contiene.
          fetch-depth: 0

      # AGP 8.7 e Chaquopy 17 richiedono JDK 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # buildPython di Chaquopy: il major.minor dell'interprete host deve
      # coincidere con `chaquopy.defaultConfig.version` (3.11). L'ubuntu
      # runner ha python3 più recente di default, senza questo step la build
      # fallirebbe con un mismatch di versione.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # SDK commandline tools + licenze accettate; piattaforme/build-tools
      # vengono scaricati da AGP al primo build.
      - uses: android-actions/setup-android@v4

      # Il keystore non vive mai nel repo: il secret è il file .jks in base64.
      # Il runner lo decodifica in un path temporaneo, che Gradle legge via
      # JENNY_KEYSTORE_PATH. Secret assente → file assente → release unsigned
      # (hasReleaseSigning in build.gradle.kts controlla l'esistenza del file).
      # NB: niente `secrets` nell'if di step (context non ammesso): si usa una
      # guardia shell dentro lo step, con il secret passato via env.
      - name: Prepare signing keystore
        env:
          JENNY_KEYSTORE_B64: ${{ secrets.JENNY_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${JENNY_KEYSTORE_B64:-}" ]; then
            echo "no signing secret: release will be unsigned"
            exit 0
          fi
          echo "$JENNY_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jenny-release.jks"
          chmod 600 "$RUNNER_TEMP/jenny-release.jks"
          test -s "$RUNNER_TEMP/jenny-release.jks"
          echo "signing keystore ready ($(wc -c < "$RUNNER_TEMP/jenny-release.jks") bytes)"

      - name: Build APKs
        env:
          # Vuoti (secret non configurati) → release unsigned, come da design.
          JENNY_KEYSTORE_PATH: ${{ runner.temp }}/jenny-release.jks
          JENNY_KEYSTORE_PASSWORD: ${{ secrets.JENNY_KEYSTORE_PASSWORD }}
          JENNY_KEY_ALIAS: ${{ secrets.JENNY_KEY_ALIAS }}
          JENNY_KEY_PASSWORD: ${{ secrets.JENNY_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew --no-daemon app:assembleDebug app:assembleRelease

      # Il manifest dell'updater in-app (latest.json) vive SOLO su APK
      # firmato: un APK unsigned non è installabile dall'updater, quindi non ha
      # senso pubblicare un manifest che lo punti. La presenza di
      # app-release.apk (nome dell'output firmato) è la guardia naturale.
      - name: Generate update manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$RELEASE_APK" ]; then
            python3 scripts/release.py "$VERSION" --manifest-only \
              --apk "$RELEASE_APK" \
              --summary-it "Tool web di nuovo in chat, bottone Stop, browser agentico." \
              --summary-en "Web tools back in chat, Stop button, agentic browser." \
              --out dist/release
          else
            echo "no signed APK: skipping update manifest"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          # Senza i secret JENNY_KEYSTORE_* la release è unsigned e AGP la
          # chiama app-release-unsigned.apk: accetta entrambi i nomi.
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          [ -f "$RELEASE_APK" ] || RELEASE_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$RELEASE_APK"
          test -f "$DEBUG_APK"
          # Nomi versionati, più chiari di app-release.apk nella pagina release.
          cp "$RELEASE_APK" "jenny-${TAG}.apk"
          cp "$DEBUG_APK" "jenny-${TAG}-debug.apk"
          # latest.json: c'è solo quando l'APK è firmato (step precedente).
          MANIFEST="dist/release/latest.json"
          EXTRA=""
          [ -f "$MANIFEST" ] && EXTRA="$MANIFEST"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Rerun del workflow o tag già rilasciato: aggiorna gli asset.
            gh release upload "$TAG" "jenny-${TAG}.apk" "jenny-${TAG}-debug.apk" $EXTRA \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "jenny-${TAG}.apk" "jenny-${TAG}-debug.apk" $EXTRA \
              --repo "$GITHUB_REPOSITORY" --title "Jenny $TAG" --generate-notes
          fi
